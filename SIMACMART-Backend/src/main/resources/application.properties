# SIMACMART — Configuración de la Aplicación
app.port=8080

# PostgreSQL Central (Nube / Servidor)
db.postgres.url=jdbc:postgresql://localhost:5432/simacmart
db.postgres.user=postgres
db.postgres.password=postgres

# SQLite Búfer Local Offline (Store-and-Forward)
db.sqlite.path=simacmart_offline_buffer.db
db.sqlite.enabled=true
